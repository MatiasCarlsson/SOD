apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: sod-cluster
servers: 1
agents: 2
image: rancher/k3s:v1.31.5-k3s1
ports:
  - port: 8081:80
    nodeFilters:
      - loadbalancer
options:
  k3d:
    wait: true
    timeout: "120s"
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true

